spring:
  application:
    name: dental-backend

  # The database layer (DataSource + JPA) is OPT-IN via the "db" profile. This
  # lets the API — and /api/health, /api/ai/test — boot during early development
  # before Neon credentials exist. Spring Data JPA and the Postgres driver stay
  # on the classpath, ready for the teammate finalizing the schema.
  #
  # Run WITHOUT a database:   java -jar app.jar
  # Run WITH Neon:            SPRING_PROFILES_ACTIVE=db java -jar app.jar
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

server:
  port: 8080

# --- Application-specific configuration ---------------------------------------
app:
  # Amazon Bedrock. Region and model ID are centralized here, not hardcoded in
  # Java. Overridable via BEDROCK_REGION / BEDROCK_MODEL_ID env vars if needed.
  bedrock:
    region: ${BEDROCK_REGION:us-east-2}
    model-id: ${BEDROCK_MODEL_ID:us.amazon.nova-2-lite-v1:0}

  # Benefits-EDUCATION chatbot. Separate, dedicated model ID so the education
  # capability can use a different model from the procedure-intent integration.
  # Region and credentials come from the shared Bedrock setup above. If the model
  # ID is blank or disabled, glossary answers still work via a deterministic
  # plain-language fallback. Set EDUCATION_BEDROCK_MODEL_ID to enable rewriting.
  education:
    bedrock:
      enabled: ${EDUCATION_BEDROCK_ENABLED:true}
      model-id: ${EDUCATION_BEDROCK_MODEL_ID:}

  # Centralized dev CORS. Comma-separated list; defaults to the Vite dev server.
  # 5174 is Vite's automatic fallback when 5173 is already in use, so both are
  # allowed by default to avoid a 403 after an auto port-bump. Override in prod.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

logging:
  level:
    com.codelinc.dental: INFO

---
# ===========================================================================
# "db" profile: enable the database. Activate with SPRING_PROFILES_ACTIVE=db
# once DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD are set.
# ===========================================================================
spring:
  config:
    activate:
      on-profile: db

  # Re-enable the auto-configuration excluded above by clearing the exclude list.
  autoconfigure:
    exclude:

  # --- Database (Neon Postgres) ---------------------------------------------
  # All values come from environment variables. NEVER commit a real connection
  # string or credentials. See .env.example for the variable names.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # SQL run on every new connection. Defaults to a harmless no-op. Set DATABASE_INIT_SQL to pick a
      # schema, e.g. "SET search_path TO molarity, public" (use a direct, non-pooled Neon host: the
      # pooler ignores startup settings such as currentSchema).
      connection-init-sql: ${DATABASE_INIT_SQL:SELECT 1}

  jpa:
    hibernate:
      # Do NOT let Hibernate create, drop, or alter the schema. The SQL under
      # db/migrations/ owns it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      # Don't run schema.sql/data.sql on startup; migrations are applied separately.
      mode: never
